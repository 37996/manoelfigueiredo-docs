site_name: MF Tech Solutions – Documentação Oficial
site_description: Documentação técnica, estratégica e operacional da MF Tech Solutions.
site_url: https://git.mftechsolutions.pt

theme:
  name: material
  custom_dir: overrides
  language: pt
  palette:
    scheme: slate
    primary: orange
    accent: deep orange
  logo: assets/logo-laranja.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/manoelfigueiredo/
      name: Manoel Figueiredo no LinkedIn
    - icon: fontawesome/brands/whatsapp
      link: https://wa.me/351910680449
      name: Falar com a MF Tech Solutions no WhatsApp

nav:
  - Início: index.md
  - Manoel Figueiredo:
      - Visão Geral: manoel-figueiredo/index.md
      - História: manoel-figueiredo/historia.md
      - Experiência: manoel-figueiredo/experiencia.md
      - Projetos: manoel-figueiredo/projetos.md
      - Habilidades: manoel-figueiredo/habilidades.md
      - Liderança: manoel-figueiredo/lideranca.md
      - Missão, Visão e Valores: manoel-figueiredo/missao-visao-valores.md
      - Media Kit: manoel-figueiredo/media-kit.md
  - Casos de Uso:
      - LG Beauty & Academy – Automação Total: use-cases/lg-beauty-academy-automacao-total.md
  - Jornadas:
      - Do Zero ao Handicap Zero: jornadas/hcp-zero.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - md_in_html

plugins:
  - search
  - minify:
      minify_html: true
